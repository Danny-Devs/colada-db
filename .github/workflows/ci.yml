# CI — the gate of record for colada-db (DAN-658, ADR-021).
#
# Before this file existed, every durable encoding in the repo — the 437-test
# suite, the `no-unguarded-process-env` rule, the DAN-647/648 durability pins,
# the ADR-019 type-surface gate — fired only when a human remembered to type the
# command. This workflow is what makes "lint > test > skill > LESSONS.md" true
# here instead of aspirational.
#
# Four jobs, deliberately independent so a failure names itself:
#   gate            — the four DoR commands, on every Node the TOOLCHAIN supports
#   browser         — the L4 durability lane: real IndexedDB + real OPFS, in a
#                     real Chromium, with the page killed between write and read
#   publish-surface — textual invariants of the BUILT artifact, plus the packed
#                     file list diffed against a checked-in expected manifest
#   engines-floor   — the artifact actually runs on the Node `engines` claims
#
# ⚠️ CI is currently ADVISORY, not blocking: the repo is private on a plan
# without branch protection (`gh api .../branches/main/protection` → 403), so a
# red run does not stop a merge. See ADR-021 "Enforcement status" for the checks
# to mark required once that changes, and do not use `[skip ci]` here meanwhile.
#
# On the Node split (the non-obvious part, see ADR-021): `engines.node` says
# ">=18", but the dev toolchain floor is 20.19 (tsdown >=20.19, oxlint and vite
# ^20.19 || >=22.12). Those are two different claims — one about consumers, one
# about contributors — and a single matrix cannot express both. `gate` covers
# the toolchain; `engines-floor` covers the consumer promise by installing the
# packed tarball on Node 18 and importing it. Neither claim is weakened to make
# the other convenient.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A force-push or a rapid second push supersedes the run it interrupted. `main`
# is excluded from cancellation: its runs are the historical record of what was
# green when, and cancelling those loses the answer to "was this ever verified".
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── The Definition-of-Done gate, exactly as AGENTS.md spells it ────────────
  # `-r` is workspace-recursive and covers the root AND `packages/*` because the
  # repo `.npmrc` sets `include-workspace-root=true`. Steps are split so the red
  # X in the UI names the failing gate without anyone opening the log.
  gate:
    name: gate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # One Node version failing is a finding about THAT version. Killing its
      # siblings throws away the comparison that identifies it as such.
      fail-fast: false
      matrix:
        # The toolchain floor (20.19, via tsdown/oxlint/vite), current LTS, and
        # current. NOT 18 — see the header and `engines-floor` below.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: `cache: pnpm` resolves the store path by
      # running pnpm, which has to exist first. Version comes from the
      # `packageManager` field in package.json — one source of truth.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: CI=true pnpm -r test

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

  # ── The L4 real-browser durability lane (DAN-652) ──────────────────────────
  # `gate` proves the engines agree with their stand-ins: happy-dom, a fake
  # IndexedDB, a `:memory:` SQLite. This job is the only one where the storage
  # is real and the process actually dies. Without it the lane would exist but
  # never fire — a suite nothing triggers rots silently while still reading as
  # coverage, which is the exact failure this repo's LESSONS.md keeps finding.
  #
  # NOT folded into `gate`: it needs a ~180 MB browser download and boots a dev
  # server, so putting it in the matrix would triple that cost across three Node
  # versions to prove something Node-version-independent. One Node is correct
  # here — the variable under test is the BROWSER.
  #
  # Chromium only, matching playwright.config.ts. WebKit's OPFS quirks are
  # roadmap 4.2; adding a browser nobody has run would be a green tick over an
  # untested claim.
  browser:
    name: browser durability lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Keyed on the lockfile because that is what pins @playwright/test, and
      # the browser build a Playwright release demands is a function of that
      # version. A miss just means the download runs — never a wrong browser.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` pulls the shared libraries headless Chromium needs on a
      # bare runner; those are OS packages and are deliberately not cached.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Real IndexedDB + real OPFS durability
        run: CI=true pnpm test:browser

      # playwright.config.ts sets `trace: retain-on-failure`, so this is empty
      # on green and carries the full timeline on red. A durability failure is
      # the kind you cannot reproduce by staring at the assertion.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ── Textual invariants of the shipped artifact ─────────────────────────────
  # Separate job, not a fifth step in `gate`: these assertions are about what
  # gets published, they are Node-version-independent, and a red X labelled
  # "publish-surface" carries information that a red "gate (node 22)" does not.
  publish-surface:
    name: publish surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Primary implementation. Self-tests every detector against a synthetic
      # counter-example before asserting, so a detector that can no longer fail
      # is reported as broken rather than green (LESSONS.md 2026-07-23: a gate
      # that manufactures confidence it has not earned is worse than no gate).
      - name: Assert publish surface
        run: node scripts/check-publish-surface.mjs

      # ADR-022 line 2 — the public API surface. Separate from the gate above:
      # that one asserts the emitted types are framework-FREE (ADR-019), which a
      # surface can satisfy perfectly while having silently dropped an export.
      # This one diffs the surface itself against a committed report, so
      # "did the public surface change?" is answered by a diff rather than by
      # whether a reviewer happened to look.
      # Prove the differ can FAIL before trusting it to pass — the same
      # discipline check-pack-manifest.sh and cross-check-publish-surface.sh
      # already apply inline on every run. This gate was the odd one out: it
      # shipped a --selftest that nothing invoked, so a green tick meant "the
      # report matched" OR "the comparison silently degraded", with no way to
      # tell them apart. Seven positive controls, including a dropped export
      # and comment-stripping that must not eat a URL inside a string literal.
      - name: Prove the API differ can fail
        run: node scripts/check-api-report.mjs --selftest

      - name: Assert the public API report
        run: node scripts/check-api-report.mjs

      # Independent cross-check: same four invariants, different tool, literal
      # hardcoded paths. Not redundant with the step above — the Node script's
      # positive controls prove each DETECTOR can fire, but cannot catch the
      # script reading a wrong-yet-existing file, under which both the controls
      # and the assertions would pass vacuously.
      #
      # The script self-tests its own helpers before asserting, and uses explicit
      # `if`/`exit 1` rather than `! grep -q ...`. That is not style: `set -e` is
      # IGNORED for `!`-negated commands (POSIX), so the obvious spelling is a
      # silent no-op. See LESSONS.md 2026-07-23.
      - name: Cross-check publish surface (independent implementation)
        run: bash scripts/cross-check-publish-surface.sh

      # The `files` allowlist decides what a consumer actually receives, so it
      # is asserted against a checked-in expected manifest — in BOTH directions.
      #
      # This step used to `pnpm pack` and print `tar -tzf | sort`. Printing is
      # not asserting: a file that should ship but stopped shipping went green,
      # and a file that should NEVER ship (`.env`, `src/`, a stray fixture) went
      # green too. Combined with the engines-floor self-reference bug fixed in
      # the same pass, the allowlist had zero coverage in either direction.
      - name: Pack and assert the publish manifest
        run: bash scripts/check-pack-manifest.sh

  # ── The `engines` claim, actually tested ───────────────────────────────────
  # `engines.node: ">=18"` is a promise to consumers. Nothing verified it, and
  # the toolchain cannot run on 18, so the promise was untested by construction.
  # This job builds on a Node the toolchain supports, then switches the runtime
  # to the claimed floor and consumes the package the way a user would: install
  # the tarball, import by bare specifier, exercise the store.
  engines-floor:
    name: engines floor (node 18 consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install and build (toolchain Node)
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      # Second setup-node call swaps the active runtime in place — no artifact
      # round-trip between jobs, and the tarball under test is byte-identical to
      # the one just built.
      - uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Consume the tarball on the claimed engines floor
        run: |
          set -euxo pipefail
          node -v
          # Resolve the peer range from the manifest rather than hardcoding a
          # version, so this cannot drift away from what the repo declares.
          VUE_RANGE="$(node -p "require('$GITHUB_WORKSPACE/package.json').peerDependencies['@vue/reactivity']")"
          # Outside the workspace: an npm install inside it would inherit the
          # repo .npmrc and pnpm's linked layout, testing something other than
          # what a consumer gets.
          mkdir -p "$RUNNER_TEMP/floor" && cd "$RUNNER_TEMP/floor"
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/colada-db-*.tgz "@vue/reactivity@$VUE_RANGE"
          # The script must be COPIED here, never run from $GITHUB_WORKSPACE.
          # Node's package self-reference rule resolves `import("colada-db")`
          # through the *enclosing* package's own `exports` map when the
          # importing file lives inside the package — so running it in place
          # loaded $GITHUB_WORKSPACE/dist and never opened the tarball. Measured
          # 2026-07-23: this job was green against a consumer dir with NOTHING
          # installed, and green against a tarball shipping no `dist` at all.
          # See LESSONS.md 2026-07-23 and the header of the script itself.
          cp "$GITHUB_WORKSPACE/scripts/smoke-consumer.mjs" ./smoke-consumer.mjs
          node ./smoke-consumer.mjs
